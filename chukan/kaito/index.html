<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>２学期中間テスト 解答・解説</title>
<style>
  :root {
    --ink-dark: #263238;
    --ink: #37474f;
    --bg: #f4f6fb;
    --card: #ffffff;
  }
  * { box-sizing: border-box; }
  body {
    font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
    background: var(--bg);
    margin: 0;
    padding: 0;
    color: #222;
    line-height: 1.7;
  }
  header {
    background: linear-gradient(135deg, var(--ink-dark), var(--ink));
    color: white;
    padding: 36px 16px 38px;
    text-align: center;
  }
  header h1 { margin: 0 0 8px; font-size: 1.6rem; }
  header p { margin: 0; font-size: 0.95rem; opacity: 0.92; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 24px 16px 40px; }
  .back { display: inline-block; margin-bottom: 14px; font-size: 0.88rem; color: var(--ink-dark); text-decoration: none; }
  .subject-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .subject-card {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
    background: var(--card); border-radius: 18px; padding: 28px 12px;
    text-decoration: none; box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    border-top: 6px solid var(--set-color); transition: transform 0.1s;
  }
  .subject-card:active { transform: scale(0.97); }
  .subject-card .emoji { font-size: 2.2rem; }
  .subject-card .name { font-size: 1.1rem; font-weight: bold; color: var(--set-color-dark); }
  .subject-card .sub { font-size: 0.8rem; color: #666; }
  .footer-note { text-align: center; font-size: 0.78rem; color: #999; padding: 20px 16px 30px; }
</style>
</head>
<body>

<header>
  <h1>✅ 解答・解説</h1>
  <p>２学期中間テスト　令和8年度 第3学年</p>
</header>

<div class="wrap">
  <a class="back" href="../">← ２学期中間テストへ戻る</a>
  <div class="subject-grid">
    <!-- cards:start -->
    <a class="subject-card" style="--set-color:#2e7d32; --set-color-dark:#1b5e20;" href="shakai.html">
      <span class="emoji">🏯</span>
      <span class="name">社会（公民）</span>
      <span class="sub">解答・解説</span>
    </a>
    <a class="subject-card" style="--set-color:#2f8f5f; --set-color-dark:#1c5c3c;" href="rika.html">
      <span class="emoji">🔬</span>
      <span class="name">理科</span>
      <span class="sub">解答・解説</span>
    </a>
    <!-- cards:end -->
  </div>
</div>

<div class="footer-note">まず自分で解いてから、答え合わせをしましょう。</div>

</body>
</html>
