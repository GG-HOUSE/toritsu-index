<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>都立高校入試 対策トップページ</title>
<style>
  :root {
    --ink-dark: #263238;
    --ink: #37474f;
    --bg: #f4f6fb;
    --card: #ffffff;
  }
  * { box-sizing: border-box; }
  body {
    font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
    background: var(--bg);
    margin: 0;
    padding: 0;
    color: #222;
    line-height: 1.7;
  }
  header {
    background: linear-gradient(135deg, var(--ink-dark), var(--ink));
    color: white;
    padding: 36px 16px 38px;
    text-align: center;
  }
  header h1 { margin: 0 0 8px; font-size: 1.6rem; }
  header p { margin: 0; font-size: 0.95rem; opacity: 0.92; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 24px 16px 40px; }
  .subject-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .subject-card {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
    background: var(--card); border-radius: 18px; padding: 28px 12px;
    text-decoration: none; box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    border-top: 6px solid var(--set-color); transition: transform 0.1s;
  }
  .subject-card:active { transform: scale(0.97); }
  .subject-card .emoji { font-size: 2.2rem; }
  .subject-card .name { font-size: 1.1rem; font-weight: bold; color: var(--set-color-dark); }
  .subject-card.wide { grid-column: 1 / -1; flex-direction: row; padding: 20px; }
  .footer-note { text-align: center; font-size: 0.78rem; color: #999; padding: 20px 16px 30px; }
</style>
</head>
<body>

<header>
  <h1>📚 都立高校入試 対策トップページ</h1>
  <p>教科を選んでね</p>
</header>

<div class="wrap">
  <div class="subject-grid">
    <a class="subject-card" style="--set-color:#2f5fa8; --set-color-dark:#1a3d6d;" href="https://gg-house.github.io/toritsu-sugaku/">
      <span class="emoji">📐</span>
      <span class="name">数学</span>
    </a>
    <a class="subject-card" style="--set-color:#7a1f3d; --set-color-dark:#4e1327;" href="https://gg-house.github.io/toritsu-kokugo/">
      <span class="emoji">📖</span>
      <span class="name">国語</span>
    </a>
    <a class="subject-card" style="--set-color:#2f5fa8; --set-color-dark:#1a3d6d;" href="https://gg-house.github.io/toritsu-eigo/">
      <span class="emoji">🔤</span>
      <span class="name">英語</span>
    </a>
    <a class="subject-card" style="--set-color:#2e7d32; --set-color-dark:#1b5e20;" href="https://gg-house.github.io/toritsu-shakai/">
      <span class="emoji">🏯</span>
      <span class="name">社会</span>
    </a>
    <a class="subject-card wide" style="--set-color:#2f8f5f; --set-color-dark:#1c5c3c;" href="https://gg-house.github.io/toritsu-rika/">
      <span class="emoji">🔬</span>
      <span class="name">理科</span>
    </a>
  </div>
</div>

<div class="footer-note">各教科のページには、都立入試の出題傾向にもとづくオリジナル予想問題があります。</div>

</body>
</html>
